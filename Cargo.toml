[package]
name = "intrico"
version = "2.5.1"
edition = "2024"
description = "High-performance Quantum Computing library to simulate, and visualize quantum circuits with precision and power."
authors = ["Soham Ghugare <soham.ghugare@gmail.com>"]
keywords = ["quantum-computing", "quantum-technology", "quantum-sdk", "quantum", "rust"]
categories = ["development-tools", "science", "simulation"]
license = "Apache-2.0"
repository = "https://github.com/Intrico-Labs/intrico"
readme = "README.md"

[dependencies]
chrono = { version = "0.4.42", features = ["serde"] }
rand = "0.9.2"
rand_distr = "0.5.1"
rusticle = "1.0.4"
smallvec = "1.15.1"
